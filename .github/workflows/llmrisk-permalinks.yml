name: llmrisk permalinks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate canonical 2026 /llmrisk/ permalinks
        run: python .github/scripts/test_validate_llmrisk_permalinks.py
